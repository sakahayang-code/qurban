<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - PDKQu Sistem Informasi Qurban</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{
  --primary:#059669;
  --primary-gradient:linear-gradient(135deg, #059669 0%, #10b981 100%);
  --text:#0f172a;
  --muted:#64748b;
  --border:#cbd5e1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  min-height:100%;
  display:grid;
  place-items:center;
  padding:24px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 15%, rgba(16,185,129,.12), transparent 35%),
    radial-gradient(circle at 85% 15%, rgba(37,99,235,.10), transparent 30%),
    radial-gradient(circle at 75% 85%, rgba(245,158,11,.08), transparent 35%),
    linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
  overflow:hidden;
  position:relative;
}
body:before,body:after{
  content:"";
  position:absolute;
  border-radius:999px;
  filter:blur(80px);
  opacity:.45;
  pointer-events:none;
}
body:before{
  width:380px;height:380px;
  left:-120px;bottom:-140px;
  background:linear-gradient(135deg,#a7f3d0,#6ee7b7);
}
body:after{
  width:340px;height:340px;
  right:-100px;top:-120px;
  background:linear-gradient(135deg,#fed7aa,#fde68a);
}
form{
  width:min(440px,100%);
  padding:40px 36px;
  position:relative;
  z-index:1;
  border:1px solid #e2e8f0;
  border-radius:24px;
  background:rgba(255,255,255,.96);
  box-shadow:0 20px 60px -10px rgba(15,23,42,.12),0 8px 24px -5px rgba(15,23,42,.06);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
form:before{
  content:"";
  display:block;
  width:64px;height:6px;
  margin-bottom:24px;
  border-radius:99px;
  background:linear-gradient(90deg,#10b981,#3b82f6);
}
.brand-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:5px 14px;
  border-radius:999px;
  background:#fef3c7;
  border:1px solid #fde68a;
  color:#92400e;
  font-size:12px;
  font-weight:750;
  margin-bottom:16px;
}
h1{margin:0 0 6px;font-size:28px;line-height:1.2;letter-spacing:-.6px;color:#0f172a;font-weight:850}
p{color:#64748b;margin:0 0 24px;font-size:14px;font-weight:500}
label{display:block;font-weight:650;margin:16px 0 7px;font-size:14px;color:#334155}
input{
  width:100%;
  padding:13px 15px;
  border:1.5px solid var(--border);
  border-radius:12px;
  font-size:15px;
  background:#ffffff;
  color:#0f172a;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{
  border-color:#10b981;
  box-shadow:0 0 0 4px rgba(16,185,129,.15);
}
button{
  width:100%;
  margin-top:24px;
  padding:14px 16px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:var(--primary-gradient);
  box-shadow:0 8px 20px rgba(16,185,129,.35);
  font-size:16px;
  font-weight:750;
  cursor:pointer;
  transition:transform .18s,box-shadow .18s,filter .18s;
}
button:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(16,185,129,.45);filter:brightness(1.03)}
button:active{transform:translateY(0)}
.error{
  color:#b91c1c;
  background:#fef2f2;
  border:1px solid #fecaca;
  padding:11px 14px;
  border-radius:12px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:500;
}
form>div:last-child{
  margin-top:20px!important;
  color:#94a3b8!important;
}
@media(max-width:480px){
  body{padding:16px}
  form{padding:30px 22px;border-radius:20px}
  h1{font-size:25px}
}
</style>
</head>
<body>
<form method="post" action="login.php" autocomplete="on">
<div class="brand-pill">
  <span>Tahun 1447 H / 2026 M</span>
</div>
<h1>Login Panitia</h1>
<p>Sistem Informasi Manajemen Qurban (PDKQu)</p>
<div id="msg" class="error" hidden>Username atau password salah.</div>
<label for="username">Username</label>
<input id="username" name="username" required autocomplete="username" placeholder="Masukkan username">
<label for="password">Password</label>
<input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Masukkan password">
<button type="submit">Masuk ke Sistem</button>
<div style="margin-top:16px;text-align:center;color:#94a3b8;font-size:12px">Akun default: <strong style="color:#475569">admin / admin</strong></div>
</form>
<script>
const q=new URLSearchParams(location.search);
if(q.get('error')==='1')document.getElementById('msg').hidden=false;
</script>
</body>
</html>
