<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - PDKQu Sistem Informasi Qurban</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{
  --primary:#10b981;
  --primary-dark:#059669;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(52,211,153,.26);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  min-height:100%;
  display:grid;
  place-items:center;
  padding:24px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 18% 18%,rgba(16,185,129,.24),transparent 35%),
    radial-gradient(circle at 82% 16%,rgba(245,158,11,.16),transparent 30%),
    radial-gradient(circle at 75% 85%,rgba(5,150,105,.22),transparent 35%),
    linear-gradient(135deg,#051a14 0%,#082e23 45%,#04140f 100%);
  overflow:hidden;
  position:relative;
}
body:before,body:after{
  content:"";
  position:absolute;
  border-radius:999px;
  filter:blur(60px);
  opacity:.35;
  pointer-events:none;
}
body:before{
  width:360px;height:360px;
  left:-100px;bottom:-140px;
  background:linear-gradient(135deg,#10b981,#34d399);
}
body:after{
  width:320px;height:320px;
  right:-90px;top:-110px;
  background:linear-gradient(135deg,#f59e0b,#10b981);
}
form{
  width:min(440px,100%);
  padding:38px 34px;
  position:relative;
  z-index:1;
  border:1px solid rgba(52,211,153,.28);
  border-radius:24px;
  background:rgba(8,45,34,.90);
  box-shadow:0 30px 90px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.35);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
form:before{
  content:"";
  display:block;
  width:64px;height:6px;
  margin-bottom:24px;
  border-radius:99px;
  background:linear-gradient(90deg,#10b981,#fbbf24);
}
.brand-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:4px 12px;
  border-radius:999px;
  background:rgba(245,158,11,.14);
  border:1px solid rgba(245,158,11,.4);
  color:#fbbf24;
  font-size:12px;
  font-weight:700;
  margin-bottom:14px;
}
h1{margin:0 0 6px;font-size:30px;line-height:1.15;letter-spacing:-.6px;color:#fff;font-weight:800}
p{color:#94a3b8;margin:0 0 24px;font-size:14px}
label{display:block;font-weight:650;margin:16px 0 7px;font-size:14px;color:#cbd5e1}
input{
  width:100%;
  padding:13px 15px;
  border:1px solid var(--border);
  border-radius:12px;
  font-size:15px;
  background:rgba(4,24,18,.85);
  color:#fff;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{
  border-color:#34d399;
  box-shadow:0 0 0 4px rgba(52,211,153,.20);
}
button{
  width:100%;
  margin-top:24px;
  padding:13px 16px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:linear-gradient(135deg,#10b981,#059669);
  box-shadow:0 10px 24px rgba(16,185,129,.35);
  font-size:16px;
  font-weight:750;
  cursor:pointer;
  transition:transform .18s,box-shadow .18s,filter .18s;
}
button:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(16,185,129,.5);filter:brightness(1.05)}
button:active{transform:translateY(0)}
.error{
  color:#fca5a5;
  background:rgba(239,68,68,.16);
  border:1px solid rgba(239,68,68,.35);
  padding:11px 12px;
  border-radius:10px;
  margin-bottom:14px;
  font-size:14px;
}
form>div:last-child{
  margin-top:20px!important;
  color:#64748b!important;
}
@media(max-width:480px){
  body{padding:16px}
  form{padding:28px 22px;border-radius:20px}
  h1{font-size:26px}
}
</style>
</head>
<body>
<form method="post" action="login.php" autocomplete="on">
<div class="brand-pill">
  <span>Tahun 1447 H / 2026 M</span>
</div>
<h1>Login Panitia</h1>
<p>Sistem Informasi Manajemen Qurban (PDKQu)</p>
<div id="msg" class="error" hidden>Username atau password salah.</div>
<label for="username">Username</label>
<input id="username" name="username" required autocomplete="username" placeholder="Masukkan username">
<label for="password">Password</label>
<input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Masukkan password">
<button type="submit">Masuk ke Sistem</button>
<div style="margin-top:14px;text-align:center;color:#64748b;font-size:12px">Akun default: <strong style="color:#94a3b8">admin / admin</strong></div>
</form>
<script>
const q=new URLSearchParams(location.search);
if(q.get('error')==='1')document.getElementById('msg').hidden=false;
</script>
</body>
</html>
