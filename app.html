<style id="visual-kekinian-refresh">
/* VISUAL ONLY: modern, interactive, comfortable UI refresh */
:root{
  --ui-bg:#f4f7f6;
  --ui-surface:rgba(255,255,255,.94);
  --ui-border:rgba(15,118,110,.10);
  --ui-primary:#087f5b;
  --ui-primary-2:#10a77b;
  --ui-text:#16302a;
  --ui-muted:#71827d;
  --ui-shadow:0 10px 30px rgba(15,23,42,.07);
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 8% 0%,rgba(16,167,123,.12),transparent 28rem),
    radial-gradient(circle at 92% 8%,rgba(59,130,246,.08),transparent 24rem),
    linear-gradient(180deg,#f7faf9 0%,var(--ui-bg) 100%)!important;
  color:var(--ui-text);
}
body > #root > .min-h-screen{background:transparent!important}

/* Desktop sidebar */
@media(min-width:768px){
  body > #root > .min-h-screen > div:first-child{
    box-shadow:10px 0 35px rgba(15,23,42,.08)!important;
  }
  body > #root > .min-h-screen > div:nth-child(2){
    border-right:1px solid rgba(255,255,255,.08)!important;
    background:
      radial-gradient(circle at 20% 0%,rgba(16,185,129,.16),transparent 20rem),
      linear-gradient(180deg,#075f49,#064b3c)!important;
  }
  body > #root > .min-h-screen > div:nth-child(2) nav{padding:18px!important}
}

/* Content surfaces */
.max-w-7xl > .space-y-6 > div,
.max-w-7xl > .space-y-6 > section,
.max-w-7xl .bg-white{
  border-color:var(--ui-border)!important;
}
.max-w-7xl .bg-white{
  box-shadow:var(--ui-shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.max-w-7xl .bg-white:hover{
  box-shadow:0 14px 38px rgba(15,23,42,.09);
}
.max-w-7xl button{
  transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease;
}
.max-w-7xl button:hover{transform:translateY(-1px)}

.max-w-7xl input,.max-w-7xl select,.max-w-7xl textarea{
  border-color:#dce7e3!important;
  border-radius:11px!important;
  background:rgba(255,255,255,.9)!important;
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
.max-w-7xl input:focus,.max-w-7xl select:focus,.max-w-7xl textarea:focus{
  border-color:#31a981!important;
  box-shadow:0 0 0 4px rgba(16,167,123,.11)!important;
  outline:none!important;
  background:#fff!important;
}
.max-w-7xl table{
  border-radius:14px;
  overflow:hidden;
}
.max-w-7xl table thead{
  background:linear-gradient(90deg,#effaf6,#f5faf8)!important;
}
.max-w-7xl table tbody tr{
  transition:background-color .16s ease,transform .16s ease;
}
.max-w-7xl table tbody tr:hover{background:#f2faf7!important}

/* Mobile header */
@media(max-width:767px){
  body{background:#f4f7f6!important}
  body > #root > .min-h-screen > .md\:hidden{
    background:
      radial-gradient(circle at 85% 0%,rgba(255,255,255,.16),transparent 12rem),
      linear-gradient(135deg,#087f5b,#075f49)!important;
    box-shadow:0 8px 24px rgba(4,78,61,.18)!important;
    border-bottom:1px solid rgba(255,255,255,.10)!important;
  }
  .pdkq-dashboard-shell{padding-top:22px!important}
  .pdkq-welcome-card{
    background:
      radial-gradient(circle at 100% 0%,rgba(16,167,123,.16),transparent 10rem),
      linear-gradient(135deg,#ffffff,#eefaf5)!important;
    border:1px solid #d7eee6!important;
    box-shadow:0 12px 28px rgba(15,23,42,.07)!important;
  }
  .pdkq-dashboard-menu{
    border-color:#e4eeea!important;
    box-shadow:0 8px 20px rgba(15,23,42,.055)!important;
    transition:transform .18s ease,box-shadow .18s ease!important;
    overflow:hidden;
  }
  .pdkq-dashboard-menu:active{
    transform:translateY(-2px) scale(.985)!important;
    box-shadow:0 12px 24px rgba(15,23,42,.10)!important;
  }
  .pdkq-dashboard-menu:before{
    content:"";

    box-shadow:0 18px 45px rgba(15,23,42,.18)!important;
  }
}
@keyframes uiQuickIn{
  from{opacity:0;transform:translate(-50%,8px) scale(.97)}
  to{opacity:1;transform:translate(-50%,0) scale(1)}
}

/* Make common cards feel more tactile without altering content */
[class*="rounded-xl"],[class*="rounded-2xl"]{
  transition:box-shadow .2s ease,border-color .2s ease,transform .2s ease;
}
</style>
